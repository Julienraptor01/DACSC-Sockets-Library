name: build-release
on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup the Environment
        run: make setup

      - name: Build
        run: make build

      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/bin/main

  attest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    outputs:
      artifacts-url: ${{ steps.artifacts.outputs.attestation-url }}
      archive-url: ${{ steps.archive.outputs.attestation-url }}
    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          path: build/bin/main

      - name: Attest build artifacts provenance
        id: artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/bin/main

      - name: Attest build archive provenance
        id: archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: artifact.zip
          subject-digest: sha256:${{ needs.build.outputs.artifact-digest }}

  test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: TODO Add tests
        run: echo "No tests implemented yet."

  release:
    needs: [ attest, test ]
    if: startsWith(github.ref, 'refs/tags/') && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          path: build/bin/main

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Build Artifacts Attestation: ${{ needs.attest.outputs.artifacts-url }}
            Build Archive Attestation: ${{ needs.attest.outputs.archive-url }}
          generate_release_notes: true
          files: build/bin/main/*
